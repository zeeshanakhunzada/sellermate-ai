<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SellerMate AI Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
/* Layout: sticky brand bar, tab strip, one panel at a time; single-column cards that become 2 and 4 up. Dark navy + purple by design. */
:root{
  --bg:#0a1022; --surface:#111a36; --surface2:#17224a; --line:rgba(255,255,255,.09);
  --fg:#eef0fa; --muted:#98a2c3; --accent:#8b5cf6; --accent2:#a78bfa;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#38bdf8;
  --display:'Sora',system-ui,sans-serif; --body:'Plus Jakarta Sans',system-ui,sans-serif; --ur:'Noto Nastaliq Urdu','Plus Jakarta Sans',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;
  background-image:radial-gradient(48rem 24rem at 90% -8%,rgba(124,58,237,.22),transparent);background-attachment:fixed;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto}
[dir=rtl] .ur,[dir=rtl] h1,[dir=rtl] .tab{font-family:var(--ur);line-height:1.9}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:600;font-size:16px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-style:normal}
.logo b{color:var(--accent2);font-weight:600}
select,textarea,button{font:inherit;color:inherit}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.note{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.35);border-radius:12px;padding:10px 12px;color:#d9ccff;font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 14px;cursor:pointer;color:var(--muted)}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
h1{font-family:var(--display);font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.grid.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:2fr 1fr!important}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.stat small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stat strong{display:block;font-family:var(--display);font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
.two{display:grid;gap:10px;grid-template-columns:1fr;margin-top:10px}
h2{font-family:var(--display);font-size:15px;margin:0 0 10px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;font-weight:500}
td{padding:10px 8px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:500}
.s-Pending{background:rgba(251,191,36,.15);color:var(--warn)}.s-Confirmed{background:rgba(56,189,248,.15);color:var(--info)}
.s-Shipped{background:rgba(167,139,250,.18);color:var(--accent2)}.s-Delivered{background:rgba(52,211,153,.15);color:var(--good)}
.s-Cancelled{background:rgba(152,162,195,.18);color:var(--muted)}.s-Returned{background:rgba(248,113,113,.15);color:var(--bad)}
.low{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.low:first-of-type{border:0}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:92px;resize:vertical}
.btn{background:var(--accent);border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 11px;font-size:12px;color:var(--muted);cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
dl{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));margin:12px 0 0}
dl div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;overflow-wrap:anywhere}
dt{font-size:11px;color:var(--muted)}dd{margin:0}.miss{color:var(--bad)}
.fu{background:var(--surface2);border-radius:10px;padding:9px 11px;margin-top:8px}.fu small{color:var(--muted);display:block}
.int{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.int:first-of-type{border:0}.int small{color:var(--muted);display:block}
.badge{font-size:12px;border-radius:99px;padding:3px 10px;background:rgba(152,162,195,.16);color:var(--muted);white-space:nowrap}
svg text{fill:var(--muted);font-size:11px;font-family:var(--body)}
@media(prefers-reduced-motion:no-preference){.card{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>

<div class="wrap" id="app">
<header>
  <div class="logo"><i>✦</i><span>SellerMate <b>AI</b></span></div>
  <select id="lang" aria-label="Language"><option value="en">English</option><option value="ur">اردو</option><option value="ro">Roman Urdu</option></select>
</header>
<div class="note">Preview with sample data. Login, saving and real integrations work in the full app, not on this page.</div>
<div class="tabs" role="tablist" id="tabs"></div>

<section id="p-dashboard"></section>
<section id="p-orders" hidden></section>
<section id="p-assistant" hidden></section>
<section id="p-integrations" hidden></section>
</div>

<script>
const T={
 dashboard:{en:"Dashboard",ur:"ڈیش بورڈ",ro:"Dashboard"},orders:{en:"Orders",ur:"آرڈرز",ro:"Orders"},
 assistant:{en:"AI Assistant",ur:"اے آئی اسسٹنٹ",ro:"AI Assistant"},integrations:{en:"Integrations",ur:"انٹیگریشنز",ro:"Integrations"},
 sales:{en:"Total sales",ur:"کل فروخت",ro:"Kul sales"},tot:{en:"Total orders",ur:"کل آرڈرز",ro:"Kul orders"},profit:{en:"Total profit",ur:"کل منافع",ro:"Kul munafa"},
 pend:{en:"Pending orders",ur:"زیر التوا",ro:"Pending orders"},deliv:{en:"Delivered",ur:"ڈیلیور شدہ",ro:"Deliver ho chuke"},ret:{en:"Returned",ur:"واپس آئے",ro:"Wapis aaye"},
 low:{en:"Low-stock products",ur:"کم اسٹاک",ro:"Kam stock"},chart:{en:"Sales, last 14 days",ur:"فروخت، آخری 14 دن",ro:"Sales, pichle 14 din"},recent:{en:"Recent orders",ur:"حالیہ آرڈرز",ro:"Haal hi ke orders"}
};
let lang="en";const t=k=>T[k][lang];
const pkr=n=>"Rs "+Math.round(n).toLocaleString("en-PK");
const P=[{n:"Black Cotton T-Shirt",p:1500,c:800},{n:"Lawn Suit 3-Piece",p:4200,c:2600},{n:"Leather Wallet",p:1200,c:600},{n:"Wireless Earbuds",p:3500,c:2300},{n:"Smart Watch",p:5500,c:3800},{n:"Phone Cover",p:600,c:220}];
const people=[["Ayesha Khan","Lahore"],["Ali Raza","Karachi"],["Sana Malik","Islamabad"],["Hamza Sheikh","Faisalabad"],["Fatima Noor","Multan"],["Usman Tariq","Rawalpindi"]];
const SS=["Delivered","Delivered","Delivered","Delivered","Pending","Confirmed","Shipped","Returned","Cancelled"];
let s=7;const rnd=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;
const O=Array.from({length:40},(_,i)=>{const p=P[Math.floor(rnd()*P.length)],c=people[Math.floor(rnd()*people.length)],q=1+Math.floor(rnd()*3);
 return{id:i,name:c[0],city:c[1],prod:p.n,q,amt:p.p*q,cost:p.c*q,st:SS[Math.floor(rnd()*SS.length)],day:Math.floor(rnd()*14)}}).sort((a,b)=>a.day-b.day);
const del=O.filter(o=>o.st==="Delivered");
const sales=del.reduce((a,o)=>a+o.amt,0),cost=del.reduce((a,o)=>a+o.cost,0);
const series=Array.from({length:14},(_,i)=>del.filter(o=>o.day===13-i).reduce((a,o)=>a+o.amt,0));
const LOW=[["Wireless Earbuds",3],["Perfume 100ml",2],["Lawn Suit 3-Piece",4]];
const dayLabel=i=>{const d=new Date();d.setDate(d.getDate()-(13-i));return d.getDate()+"/"+(d.getMonth()+1)};

function chartSVG(){
 const W=600,H=220,L=44,B=24,Tp=10,max=Math.max(...series,1),top=Math.ceil(max/1000)*1000;
 const x=i=>L+i*(W-L-8)/13,y=v=>Tp+(H-Tp-B)*(1-v/top);
 const pts=series.map((v,i)=>[x(i),y(v)]),line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
 const area=line+` L${x(13)} ${y(0)} L${x(0)} ${y(0)} Z`;
 const ticks=[0,.5,1].map(f=>top*f);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sales over the last 14 days"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient></defs>
 ${ticks.map(v=>`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.08)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v/1000}k</text>`).join("")}
 <path d="${area}" fill="url(#g)"/><path d="${line}" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linejoin="round"/>
 <circle cx="${pts[13][0]}" cy="${pts[13][1]}" r="4" fill="#a78bfa"/>
 ${[0,4,8,13].map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===13?"end":i===0?"start":"middle"}">${dayLabel(i)}</text>`).join("")}</svg>`;
}
function dash(){
 const c=(k,v,col)=>`<div class="card stat"><small>${t(k)}</small><strong style="color:${col||"inherit"}">${v}</strong></div>`;
 return `<h1>${t("dashboard")}</h1><p class="sub">Sales and profit count Delivered orders only.</p>
 <div class="grid stats">${c("sales",pkr(sales))}${c("tot",O.length)}${c("profit",pkr(sales-cost),"var(--good)")}${c("pend",O.filter(o=>o.st==="Pending").length,"var(--warn)")}${c("deliv",del.length,"var(--good)")}${c("ret",O.filter(o=>o.st==="Returned").length,"var(--bad)")}${c("low",LOW.length,"var(--warn)")}</div>
 <div class="two"><div class="card"><h2>${t("chart")}</h2>${chartSVG()}</div>
 <div class="card"><h2>${t("low")}</h2>${LOW.map(l=>`<div class="low"><span>${l[0]}</span><span class="pill s-Pending">${l[1]} left</span></div>`).join("")}</div></div>
 <div class="card" style="margin-top:10px"><h2>${t("recent")}</h2><div class="scroll">${table(O.slice(-6).reverse())}</div></div>`;
}
function table(rows){return `<table><thead><tr><th>Customer</th><th>Product</th><th>Amount</th><th>Status</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${o.name}<br><small style="color:var(--muted)">${o.city}</small></td><td>${o.prod} × ${o.q}</td><td>${pkr(o.amt)}</td><td><span class="pill s-${o.st}">${o.st}</span></td></tr>`).join("")}</tbody></table>`}
function ordersView(){
 return `<h1>${t("orders")}</h1><p class="sub">Search, filter and edit orders in the full app.</p>
 <div class="row" style="margin:0 0 12px"><select id="flt" aria-label="Filter by status"><option>All</option>${["Pending","Confirmed","Shipped","Delivered","Cancelled","Returned"].map(x=>`<option>${x}</option>`).join("")}</select></div>
 <div class="card"><div class="scroll" id="otab"></div></div>`;
}
function bindOrders(){const f=document.getElementById("flt"),b=document.getElementById("otab");
 const r=()=>{const v=f.value,rows=O.filter(o=>v==="All"||o.st===v).slice().reverse();b.innerHTML=rows.length?table(rows):'<p class="sub">No orders with this status.</p>'};f.onchange=r;r()}

const EX=["Assalam o Alaikum, mujhe 2 black shirts chahiye. Mera address Lahore hai.","Hi, my name is Sara Ahmed. I want 1 lawn suit please. Phone 0312-3456789. Address: House 5, Street 2, Johar Town, Lahore"];
function assistantView(){return `<h1>${t("assistant")}</h1><p class="sub">Paste a customer message in Urdu, Roman Urdu or English.</p>
 <div class="card"><textarea id="msg" aria-label="Customer message">${EX[0]}</textarea>
 <div class="row"><button class="chip" data-ex="0">Example 1</button><button class="chip" data-ex="1">Example 2</button></div>
 <div class="row"><button class="btn" id="go">Analyze message</button></div></div><div id="res"></div>`}
const CITIES=["Karachi","Lahore","Islamabad","Rawalpindi","Faisalabad","Multan","Peshawar","Quetta","Sialkot"];
function parse(m){
 const ph=m.match(/(?:\+?92|0)\s?3\d{2}[\s-]?\d{7}/);let phone=null;if(ph){const d=ph[0].replace(/\D/g,"");phone=d.startsWith("92")?"0"+d.slice(2):d}
 const city=CITIES.find(c=>new RegExp("\\b"+c+"\\b","i").test(m))||null;
 const nm=m.match(/(?:mera naam|my name is|name is)\s*[:\-]?\s*([A-Za-z]+(?:\s[A-Za-z]+)?)/i);
 const am=m.match(/address\s*(?:is|hai|:|-)?\s*([^\n]+)/i);let address=null;
 if(am){let a=am[1].replace(/\s+(hai|he)\.?$/i,"").replace(/[.\s]+$/,"");if(a&&a.toLowerCase()!==(city||"").toLowerCase()&&(a.split(/\s+/).length>=2||/\d/.test(a)))address=a}
 const qt=m.replace(ph?ph[0]:"","").replace(am?am[0]:"","");const qd=qt.match(/\b(\d{1,3})\b/);
 const w=m.toLowerCase();const hit=P.find(p=>p.n.toLowerCase().replace(/[()]/g,"").split(/\s+/).map(x=>x.replace(/s$/,"")).filter(x=>x.length>2).some(x=>w.includes(x))&&p.n.toLowerCase().split(/\s+/).filter(x=>w.includes(x.replace(/s$/,""))).length>=1);
 return{"Customer name":nm?nm[1]:null,"Phone":phone,"Product":hit?hit.n:null,"Quantity":qd?qd[1]:null,"City":city,"Address":address};
}
const ASK={"Customer name":["your name","apna naam"],"Phone":["your phone number","apna phone number"],"Product":["which product you want","kaunsa product chahiye"],"Quantity":["the quantity","kitni quantity chahiye"],"City":["your city","apne shehar ka naam"],"Address":["your complete delivery address","apna mukammal delivery address"]};
function bindAssistant(){
 const msg=document.getElementById("msg"),res=document.getElementById("res");
 document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{msg.value=EX[+b.dataset.ex]});
 document.getElementById("go").onclick=()=>{const f=parse(msg.value),miss=Object.keys(f).filter(k=>!f[k]);
  res.innerHTML=`<div class="card" style="margin-top:10px"><div class="row" style="margin:0 0 4px;justify-content:space-between"><h2 style="margin:0">Extracted details</h2><span class="badge">Basic parser, AI not configured</span></div>
  <dl>${Object.entries(f).map(([k,v])=>`<div><dt>${k}</dt><dd class="${v?"":"miss"}">${v||"Missing"}</dd></div>`).join("")}</dl>
  ${miss.length?`<div class="fu"><small>Follow-up, English</small>Thank you! To confirm your order, please share ${miss.map(k=>ASK[k][0]).join(", ")}.</div><div class="fu"><small>Follow-up, Roman Urdu</small>Shukriya! Order confirm karne ke liye baraye meherbani ${miss.map(k=>ASK[k][1]).join(", ")} bata dein.</div>`:'<p style="color:var(--good)">Nothing missing. Ready to review and create the order.</p>'}</div>`}}

const INT=[["WhatsApp Business Cloud API","Messaging"],["Instagram Messaging API","Messaging"],["Facebook Messenger","Messaging"],["TCS","Courier"],["Leopards Courier","Courier"],["M&P","Courier"],["Trax","Courier"],["PostEx","Courier"],["JazzCash","Payments"],["Easypaisa","Payments"]];
function intView(){return `<h1>${t("integrations")}</h1><p class="sub">An integration is marked Connected only after a real test succeeds.</p>
 <div class="card">${INT.map((x,i)=>`<div class="int"><div>${x[0]}<small>${x[1]}</small></div><span class="badge">${i<3?"Not connected":"Adapter not built yet"}</span></div>`).join("")}</div>`}

const views={dashboard:[dash],orders:[ordersView,bindOrders],assistant:[assistantView,bindAssistant],integrations:[intView]};
let cur="dashboard";
function render(){
 document.getElementById("app").dir=lang==="ur"?"rtl":"ltr";
 document.getElementById("tabs").innerHTML=Object.keys(views).map(k=>`<button class="tab" role="tab" aria-selected="${k===cur}" data-t="${k}">${t(k)}</button>`).join("");
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.t;render()});
 Object.keys(views).forEach(k=>{const el=document.getElementById("p-"+k);el.hidden=k!==cur;if(k===cur){el.innerHTML=views[k][0]();if(views[k][1])views[k][1]()}});
}
document.getElementById("lang").onchange=e=>{lang=e.target.value;render()};
render();
</script>

</body></html>
